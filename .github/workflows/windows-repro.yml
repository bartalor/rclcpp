name: windows-repro

on:
  workflow_dispatch:

jobs:
  windows-rolling-source-build:
    runs-on: windows-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        rmw:
          - rmw_fastrtps_cpp

    env:
      CI_REPOS_URL: https://gist.githubusercontent.com/fujitatomoya/e96e535bdc812744725b6237e9eb22e6/raw/ab84ebe82133d581d33d732a722c20660dfc487c/ros2.repos
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}

    steps:
      - name: Configure git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check manifest URL reachable
        shell: pwsh
        run: Invoke-WebRequest -Method Head -Uri $env:CI_REPOS_URL -UseBasicParsing | Out-Null

      - name: Upgrade pip and setuptools (Python 3.12 ImpImporter fix)
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools

      - name: Verify pkg_resources imports
        shell: pwsh
        run: python -c "import pkg_resources"

      - name: Setup ROS 2 toolchain
        uses: ros-tooling/setup-ros@v0.7

      - name: Preflight (env)
        shell: pwsh
        run: .github/scripts/windows-preflight-env.ps1

      - name: Fetch pinned ros2.repos manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Invoke-WebRequest -Uri $env:CI_REPOS_URL -OutFile ros2.repos
          Get-Content ros2.repos | Select-Object -First 5

      - name: Verify manifest has required entries
        shell: pwsh
        run: |
          $manifest = Get-Content ros2.repos -Raw
          foreach ($entry in @("bartalor/rclcpp", "ros2/system_tests")) {
            if ($manifest -notmatch [regex]::Escape($entry)) { throw "Manifest missing entry: $entry" }
          }

      - name: vcs import sources
        shell: pwsh
        run: vcs import --workers 4 src --input ros2.repos

      - name: Preflight (sources)
        shell: pwsh
        run: .github/scripts/windows-preflight-sources.ps1

      - name: Show key package commits
        shell: pwsh
        run: |
          git -C src/bartalor/rclcpp log -1 --oneline
          git -C src/ros2/system_tests log -1 --oneline

      - name: colcon build (rclcpp + test_rosidl_buffer and deps)
        shell: pwsh
        run: .github/scripts/windows-build.ps1

      - name: colcon test (rclcpp + test_rosidl_buffer)
        shell: pwsh
        run: .github/scripts/windows-test.ps1

      - name: colcon test-result
        if: always()
        shell: cmd
        run: colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rmw }}
          path: |
            build/**/test_results/**/*.xml
            log/**/*
          retention-days: 7
